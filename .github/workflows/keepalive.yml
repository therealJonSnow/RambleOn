# Supabase pauses free projects after about a week without activity. This
# pings the database every few days so a quiet week doesn't take your journal
# offline. It reads no data.
#
# Setup: in your GitHub repo, Settings → Secrets and variables → Actions, add
#   SUPABASE_URL              e.g. https://abcd1234.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  your project's publishable (or legacy anon) key
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Secrets not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" -d '{}'
